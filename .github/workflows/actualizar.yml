name: Publicar en GitHub Pages

# Este observatorio NO se regenera en CI: descargar el año completo del BOE son 313
# peticiones y el agregado tarda ~30 s, pero el catálogo completo pesa 39 MB y no tiene
# sentido reconstruirlo en cada push. Se regenera en local con `scripts/boe_fetch.py`
# y `scripts/boe_build.py`, y se sube el resultado. Aquí solo se publica `site/`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
